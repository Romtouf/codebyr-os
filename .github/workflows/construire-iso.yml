name: Construire l'ISO

# Construire Codebyr OS ne doit pas dépendre d'un seul poste. Aujourd'hui
# l'image ne sort que du WSL du mainteneur : si cette machine disparaît, plus
# personne ne sait produire une ISO — et personne ne peut vérifier que celle
# qui est publiée correspond au dépôt.
#
# Ce workflow construit l'image depuis un checkout propre, sur une machine
# neutre. C'est autant un filet de sécurité (facteur bus) qu'une preuve : si
# elle sort ici, elle sort de ce qui est publié dans le dépôt, et de rien
# d'autre.
#
# DÉCLENCHEMENT MANUEL : une construction dure 30 à 60 minutes et télécharge
# ~1,5 Go. La lancer à chaque commit gaspillerait sans rien apprendre de plus.
#
# L'ISO produite reste un ARTEFACT de vérification. Celle qu'on publie est
# signée, et la signature exige la clé — qui n'est pas ici, et n'a rien à y
# faire.

on:
  workflow_dispatch:
    inputs:
      conserver:
        description: "Jours de conservation de l'ISO produite"
        required: false
        default: "3"
      empreinte:
        description: "SHA256 attendu (celui de l'ISO publiée pour ce commit) — vide : pas de comparaison"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  iso:
    name: Image live depuis un checkout propre
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Préparer Debian trixie
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends sudo git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Installer live-build
        run: |
          sudo apt-get update -qq
          # python3 : la construction du paquet compile les traductions
          # (packaging/traductions.py) depuis la 1.18.0.
          sudo apt-get install -y --no-install-recommends \
            live-build rsync librsvg2-bin dpkg-dev xorriso squashfs-tools python3

      - name: Construire
        run: |
          set -e
          sudo -E env CODEBYR_REPO="$PWD" CODEBYR_WORK=/mnt/codebyr-build \
            bash live-build/scripts/build.sh

      - name: Vérifier ce qui est sorti
        run: |
          set -e
          iso=$(ls -1 dist/*.iso | head -n1)
          ls -lh "$iso"
          sha256sum "$iso" | tee dist/SHA256SUMS-ci

          # Une ISO qui se construit ne prouve rien : il faut vérifier qu'elle
          # contient bien CE dépôt. On la monte une fois, on regarde, on
          # démonte.
          sudo mkdir -p /mnt/iso
          sudo mount -o loop,ro "$iso" /mnt/iso
          cp /mnt/iso/live/filesystem.packages /tmp/paquets.txt
          sudo unsquashfs -l /mnt/iso/live/filesystem.squashfs > /tmp/contenu.txt
          sudo umount /mnt/iso

          echo "--- version de codebyr-tools embarquée ---"
          grep -E '^codebyr-tools' /tmp/paquets.txt

          attendue=$(tr -d ' \t\r\n' < VERSION)
          grep -qE "^codebyr-tools[[:space:]]+${attendue}$" /tmp/paquets.txt || {
            echo "::error::l'ISO ne porte pas la version $attendue"; exit 1; }

          echo "--- modules partagés (sans eux, tous les outils plantent) ---"
          for module in registre systeme applications bac_a_sable fichiers_surs filtre_syscalls relais_reseau permissions_flatpak navigateur programmes chemins flatpak_espace archives journal envois ordres_espace cote_espace; do
            grep -q "share/codebyr/${module}.py" /tmp/contenu.txt || {
              echo "::error::${module}.py absent de l'image"; exit 1; }
            echo "  ${module}.py"
          done

          echo "ISO conforme à la version $attendue."

      - name: Comparer à l'ISO publiée
        # La construction est reproductible (voir build.sh) : le même commit
        # doit redonner la même image, octet pour octet. C'est ce qui permet à
        # quiconque de vérifier, sans faire confiance au mainteneur, que l'ISO
        # publiée sort bien du code publié.
        if: ${{ inputs.empreinte != '' }}
        env:
          ATTENDUE: ${{ inputs.empreinte }}
        run: |
          set -e
          obtenue=$(sha256sum dist/*.iso | cut -d' ' -f1)
          echo "commit   : $(git -c safe.directory='*' rev-parse HEAD)"
          echo "attendue : $ATTENDUE"
          echo "obtenue  : $obtenue"
          [ "$obtenue" = "$ATTENDUE" ] || {
            echo "::error::l'ISO reconstruite diffère de l'empreinte attendue"; exit 1; }
          echo "Identique, octet pour octet."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codebyr-os-iso
          path: |
            dist/*.iso
            dist/SHA256SUMS-ci
          retention-days: ${{ inputs.conserver }}
          compression-level: 0

  demarrage:
    # Une image qui se construit ne prouve pas qu'elle démarre, ni que ses
    # protections agissent. On la démarre dans QEMU : un service inerte de
    # l'image, réveillé par « codebyr.essai=1 », observe la session live et
    # rend son verdict sur la console série (tools/essai_demarrage.sh).
    # Sur la machine hôte, pas dans le conteneur : c'est elle qui a KVM.
    name: L'image démarre et ses protections agissent
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: codebyr-os-iso
          path: dist

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Installer QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso

      - name: Démarrer l'image et lire l'essai
        run: bash tools/essai_demarrage.sh dist/*.iso

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: essai-demarrage
          path: essai-demarrage.log
          retention-days: 7
