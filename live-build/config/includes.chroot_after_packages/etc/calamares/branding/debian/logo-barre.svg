<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Logo de la barre latérale de l'installeur, sur fond sombre (#12222C).
       Calamares l'affiche dans un carré de 80 × 80 : un logo horizontal y
       devenait minuscule, et le mot « codebyr », écrit dans la couleur même du
       fond, y était invisible — il ne restait que le Sceau et « OS ». D'où ce
       logo carré, le Sceau au-dessus du nom, aux couleurs de l'écran de
       connexion (branding/greeter-logo.svg). -->
  <g transform="translate(60,40) scale(0.74) translate(-50,-50)" fill="none"
     stroke="#43C7DF" stroke-width="13" stroke-linecap="round">
    <path d="M 84.64 70 A 40 40 0 0 1 19.36 75.71"/>
    <path d="M 13.75 66.91 A 40 40 0 0 1 36.32 12.42"/>
    <path d="M 46.51 10.15 A 40 40 0 0 1 84.64 30"/>
  </g>
  <circle cx="60" cy="40" r="7" fill="#43C7DF"/>
  <text x="60" y="106" text-anchor="middle" font-family="Cantarell, DejaVu Sans, sans-serif"
        font-size="19" font-weight="700" fill="#E7EEF1">codebyr<tspan fill="#43C7DF"> OS</tspan></text>
</svg>
