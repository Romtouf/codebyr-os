# Module « packages » — version Codebyr OS.
# Identique au fichier officiel, avec en plus le retrait de calamares lui-même :
# une fois Codebyr OS installé, l'installeur n'a plus rien à faire sur le
# système (le lanceur « Installer Codebyr OS » disparaît avec lui via TryExec).
#
# Deux listes, depuis la 1.16.8. L'image ne porte plus d'index apt (ils
# changeaient chaque jour : l'ISO n'aurait pas été reproductible). Sans eux, apt
# ne connaît que les paquets INSTALLÉS : un seul nom inconnu dans « remove », et
# toute la commande échoue — l'installation s'arrêtait sur « code d'erreur 100 ».
#   · remove     : ce que l'image contient vraiment. S'il ne part pas,
#                  l'installation doit échouer, comme avant ;
#   · try_remove : ce que la liste officielle prévoit et que l'image ne contient
#                  pas. Retiré un par un s'il est là ; sinon, un avertissement.
backend: apt

operations:
  - remove:
      - 'live-boot'
      - 'live-config'
      - 'live-config-systemd'
      - 'calamares-settings-debian'
      - 'calamares'
  - try_remove:
      - 'live-boot-doc'
      - 'live-config-doc'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'
