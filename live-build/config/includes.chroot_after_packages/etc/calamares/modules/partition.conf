# Codebyr OS — module « partition » de Calamares (3.3.x).
#
# Debian ne livre aucun partition.conf : le module tournait sur ses valeurs
# internes. Ce fichier ne déclare QUE ce que Codebyr change ; toute option
# absente garde exactement sa valeur par défaut.
#
# ── CE QUI CHANGE : LE DISQUE EST CHIFFRÉ PAR DÉFAUT ─────────────────────────
# Sans chiffrement, un ordinateur perdu ou volé livre tout : les Espaces, leurs
# instantanés, la liste des sites bancaires. La case était proposée, jamais
# cochée — la protection dépendait de l'utilisateur qui pense à la cocher.
# Elle est désormais cochée d'avance dans l'installation assistée ; on peut
# encore la décocher, mais le choix sûr est celui qu'on fait sans rien toucher.
#
# ── POURQUOI UN /boot SÉPARÉ, EN CLAIR ───────────────────────────────────────
# Par défaut, Calamares chiffre aussi /boot (LUKS1) : c'est alors GRUB qui
# demande la phrase de passe au démarrage. Or GRUB ne charge aucune disposition
# de clavier — il lit en QWERTY. Un utilisateur AZERTY qui a choisi « azerty12 »
# tape en réalité autre chose, et son disque refuse de s'ouvrir. Cocher la case
# par défaut aurait envoyé tout le public francophone dans ce piège.
#
# Avec /boot à part, GRUB n'a rien à déchiffrer : c'est le système qui demande
# la phrase de passe (écran Plymouth, clavier de l'installation chargé dans
# l'initramfs — voir /etc/initramfs-tools/conf.d/codebyr-clavier). Et comme
# GRUB n'a plus à lire la partition chiffrée, elle peut être en LUKS2, dont la
# dérivation de clé (Argon2id) résiste bien mieux aux essais massifs.
#
# Ce que /boot en clair expose : le noyau et l'initramfs, aucune donnée. Le
# vol de l'ordinateur reste couvert ; la modification du démarrage par qui a eu
# la machine en main (« evil maid ») était déjà hors périmètre (SECURITY.md).
#
# Le module luksbootkeyfile, présent dans la séquence, ne crée PAS de fichier
# de clé quand /boot est séparé et non chiffré (vérifié dans le code de
# Calamares 3.3.14) : la clé du disque ne se retrouve jamais en clair sur /boot.
---

enableLuksAutomatedPartitioning: true
preCheckEncryption: true
luksGeneration: luks2

# /boot est en clair par construction, pas par oubli : l'avertissement de
# Calamares (« Boot partition not encrypted ») ne ferait qu'inquiéter.
showNotEncryptedBootMessage: false

# La partition système EFI est ajoutée automatiquement devant si nécessaire,
# l'espace d'échange derrière s'il est choisi.
partitionLayout:
    - name: "boot"
      filesystem: "ext4"
      noEncrypt: true
      mountPoint: "/boot"
      size: 1G
    - name: "codebyr"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%
