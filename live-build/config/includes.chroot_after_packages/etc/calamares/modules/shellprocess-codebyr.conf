# Job Calamares « shellprocess@codebyr » : nettoyage des artefacts live
# dans le système installé (voir codebyr-nettoyage-installation).
---
dontChroot: false
# 300 et non 120 : l'étape régénère désormais aussi la configuration de GRUB
# (réparation de l'espace d'échange chiffré, voir codebyr-durcir-poste), après
# le retrait de Calamares par apt. Un dépassement fait échouer l'installation.
timeout: 300
script:
    - command: "/usr/bin/codebyr-nettoyage-installation"
