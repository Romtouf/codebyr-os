# Codebyr OS — durcissement du noyau au démarrage (voir SECURITY.md).
#
# Lu par update-grub après /etc/default/grub : les options s'AJOUTENT à celles
# de la machine, sans rien en retirer. GRUB_CMDLINE_LINUX plutôt que ..._DEFAULT :
# elles valent aussi pour le mode de dépannage.
#
#   slab_nomerge          le noyau ne fusionne plus les caches d'objets de même
#                         taille : un débordement dans l'un ne peut plus viser
#                         les objets d'un autre. Coût : un peu de mémoire.
#   page_alloc.shuffle=1  l'ordre des pages libres est tiré au hasard : la
#                         place d'une allocation devient imprévisible.
#
# Le noyau de Debian 13 fait déjà par défaut init_on_alloc=1,
# randomize_kstack_offset=on et vsyscall=none ; init_on_free=1 est écarté pour
# son coût (plusieurs pour cent sur les charges qui allouent beaucoup).
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX slab_nomerge page_alloc.shuffle=1"
