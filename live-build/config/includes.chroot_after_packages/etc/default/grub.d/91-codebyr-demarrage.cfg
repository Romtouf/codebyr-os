# Codebyr OS — un démarrage sans texte technique, du logo du fabricant à celui
# de Codebyr (voir docs/chantiers.md, « Démarrage sans couture »).
#
# Lu par update-grub après /etc/default/grub et 90-codebyr-noyau.cfg. Rien ici
# ne remplace un choix de l'administrateur : chaque réglage n'est posé que si
# la machine a encore celui de Debian et de l'installeur.
#
#   Le menu caché. Debian le montre 5 secondes à chaque démarrage, même quand
#   il n'y a qu'un système à démarrer. Il reste une seconde à l'affût : F4
#   (Fn + F4 sur la plupart des portables), tapotée dès le logo du fabricant,
#   l'ouvre — pour le dépannage ou un noyau précédent. F4 et non Échap, que
#   GRUB accepte aussi : Échap ouvre souvent le
#   menu de l'ordinateur lui-même, et un appui de trop dans celui de GRUB mène
#   à l'invite « grub> ». Ni Maj maintenue : GRUB ne la voit que si le
#   micrologiciel la lui signale, ce que ne fait pas celui de VMware. Essayé
#   sur la VM le 01/10/2026. Quand un autre système est installé,
#   /etc/grub.d/35_codebyr_menu rend le menu visible, 5 secondes, pour choisir.
#
#   La console du micrologiciel, et non celle, graphique, de GRUB. Celle-ci
#   repeint l'écran même quand le menu est caché, et y pose le fond d'écran de
#   Debian : avec la console du micrologiciel, le logo du fabricant reste
#   affiché jusqu'au noyau. Le menu, quand il s'ouvre, est en texte.
#
#   loglevel=3 : le noyau n'écrit plus à l'écran que ses erreurs graves.
#   « quiet » laissait passer les erreurs ordinaires, comme celle que toute
#   machine virtuelle VMware affiche juste avant le logo (« piix4_smbus …
#   SMBus base address uninitialized », constaté le 01/10/2026). Elles restent
#   dans le journal. Seulement si la machine démarre déjà en silence : qui a
#   retiré « quiet » veut lire.

if [ -z "${GRUB_TIMEOUT_STYLE+x}" ] && [ "${GRUB_TIMEOUT-}" = 5 ]; then
	GRUB_TIMEOUT_STYLE=hidden
	GRUB_TIMEOUT=1
	if [ -z "${GRUB_TERMINAL-}${GRUB_TERMINAL_OUTPUT-}" ]; then
		GRUB_TERMINAL_OUTPUT=console
	fi
	# Lu par /etc/grub.d/35_codebyr_menu : c'est Codebyr qui a caché le menu,
	# et voici combien de secondes le montrer s'il y a un choix à faire.
	export CODEBYR_MENU_CACHE=5
fi

case " ${GRUB_CMDLINE_LINUX_DEFAULT-} " in
*" quiet "*)
	case " ${GRUB_CMDLINE_LINUX_DEFAULT} " in
	*" loglevel="*) ;;
	*) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} loglevel=3" ;;
	esac
	;;
esac
