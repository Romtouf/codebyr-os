# Codebyr OS — surface du noyau offerte aux programmes ordinaires.
#
# Livré par le paquet codebyr-tools, et non seulement par l'image : ce qui ne
# vit que dans l'ISO n'atteint jamais une machine déjà installée.
#
# Le filtre d'appels système des Espaces blindés refuse déjà bpf,
# perf_event_open, userfaultfd et kexec. Mais seuls les Espaces blindés en
# bénéficient, et le bureau lui-même n'est pas un Espace : ces réglages ferment
# les mêmes portes pour TOUT le système, au niveau du noyau.
#
# Aucun ne gêne un usage ordinaire. Ils ne concernent que des outils de
# développement noyau ou d'analyse de performances, qui restent utilisables en
# administrateur.

# BPF non privilégié : l'une des sources les plus régulières d'élévation de
# privilèges. « 1 » est définitif jusqu'au redémarrage — même root ne peut plus
# le rouvrir sans redémarrer.
kernel.unprivileged_bpf_disabled = 1
# Le compilateur BPF masque ses constantes : sans cela, un programme BPF sert à
# placer du code choisi dans la mémoire exécutable du noyau (JIT spraying).
net.core.bpf_jit_harden = 2

# Remplacer le noyau en marche sans redémarrer. Utile au vidage de mémoire
# après plantage, qu'aucun poste Codebyr n'utilise ; c'est aussi la façon de
# charger un noyau non signé en contournant le démarrage sécurisé.
kernel.kexec_load_disabled = 1

# userfaultfd permet de suspendre le noyau au milieu d'une copie mémoire : c'est
# l'outil qui rend fiables des exploits de concurrence autrement aléatoires.
vm.unprivileged_userfaultfd = 0

# Un programme ordinaire ne peut plus faire charger un module de « discipline
# de ligne » du terminal — plusieurs failles noyau passaient par des modules
# que personne n'utilise, chargés à la demande de l'attaquant.
dev.tty.ldisc_autoload = 0

# Injecter des caractères dans le terminal d'un autre processus (TIOCSTI) :
# la façon classique de sortir d'un bac à sable qui partage le terminal de son
# parent. Le tiret initial : ignoré sans erreur sur un noyau antérieur à 6.2,
# qui ne connaît pas ce réglage.
-dev.tty.legacy_tiocsti = 0

# Compteurs de performance : réservés à l'administrateur. Ils permettent
# d'observer finement l'activité d'autres processus, jusqu'aux attaques par
# canal auxiliaire. « 3 » est une valeur propre au noyau Debian.
kernel.perf_event_paranoid = 3
