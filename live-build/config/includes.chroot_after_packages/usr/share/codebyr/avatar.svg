<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Codebyr OS — avatar par défaut des comptes : le Sceau sur fond sombre.
       Carré plein : GNOME le découpe en disque, sur l'écran de connexion comme
       sur celui de verrouillage. Le paquet codebyr-tools en fait /etc/skel/.face,
       à la place de la spirale Debian de desktop-base (voir son preinst).
       Jamais posé directement dans /etc/skel par l'image : voir build-deb.sh. -->
  <rect width="256" height="256" fill="#12222C"/>
  <g transform="translate(128,128) scale(1.5) translate(-50,-50)" fill="none"
     stroke="#43C7DF" stroke-width="13" stroke-linecap="round">
    <path d="M 84.64 70 A 40 40 0 0 1 19.36 75.71"/>
    <path d="M 13.75 66.91 A 40 40 0 0 1 36.32 12.42"/>
    <path d="M 46.51 10.15 A 40 40 0 0 1 84.64 30"/>
  </g>
  <circle cx="128" cy="128" r="14.25" fill="#43C7DF"/>
</svg>
