#!/usr/sbin/nft -f
# Codebyr OS — pare-feu : rien n'entre qui n'a pas été demandé.
#
# Livré par codebyr-tools (/usr/share/codebyr/nftables.conf) et installé en
# /etc/nftables.conf par l'image ; codebyr-durcir-poste l'y tient à jour,
# tant que l'administrateur ne l'a pas modifié.
flush ruleset
table inet filter {
	chain input {
		type filter hook input priority 0; policy drop;
		ct state established,related accept
		iif "lo" accept
		ct state invalid drop
		ip protocol icmp accept
		ip6 nexthdr ipv6-icmp accept
		# Deux réponses que le suivi des connexions ne rattache pas à leur
		# question, parce qu'elles ne reviennent pas de l'adresse interrogée.
		# Fermées jusqu'à la 1.20.0 (voir SECURITY.md, « Analyse externe ») :
		#
		# mDNS — la découverte des imprimantes et des partages du réseau local
		# (Avahi, cups-browsed). On interroge un groupe, chacun répond au
		# groupe. Le groupe du lien local seulement : rien venu d'ailleurs.
		ip daddr 224.0.0.251 udp dport 5353 accept
		ip6 daddr ff02::fb udp dport 5353 accept
		# DHCPv6 — l'adresse et les serveurs de noms sur un réseau IPv6 géré.
		# On interroge un groupe, un serveur répond depuis son adresse : de lien
		# local, depuis le port des serveurs, vers celui des clients.
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
	}
	chain forward { type filter hook forward priority 0; policy drop; }
	chain output  { type filter hook output priority 0; policy accept; }
}
